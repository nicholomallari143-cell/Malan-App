/* NEGRONI / RECIPE DETAIL EXPANSION */
.recipePrepCard{display:flex;align-items:center}

/* RECIPE LIBRARY NATIVE EXPANSION — keep recipe cards vertical on mobile */

.nativeRecipePhoto{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;max-height:430px!important;object-fit:cover!important;border-radius:14px!important;margin:10px 0 14px!important}

.bartenderPromotion:after{content:"";position:absolute;right:-26px;bottom:-38px;width:120px;height:120px;border:1px solid rgba(228,199,125,.22);border-radius:50%;pointer-events:none}
.bartenderPromotionIcon{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(0,0,0,.2);border:1px solid #d6b76f;font-size:27px;position:relative;z-index:1}
.bartenderPromotionBody{flex:1;position:relative;z-index:1;min-width:0}
.bartenderPromotionKicker{font-size:8px;letter-spacing:2.2px;color:#e4c77d;font-weight:900;text-transform:uppercase;margin-bottom:2px}
.bartenderPromotionTitle{font-family:Georgia,serif;font-size:21px;line-height:1.05;font-weight:800;letter-spacing:.5px}
.bartenderPromotionSub{font-size:10px;color:#e8ece9;margin-top:4px;line-height:1.25}
.bartenderPromotionArrow{width:40px;height:40px;border-radius:50%;border:1px solid #d6b76f;display:flex;align-items:center;justify-content:center;color:#f0d58e;font-size:25px;font-weight:300;position:relative;z-index:1;flex:none}
.bartenderPromotionBadge{position:absolute;right:9px;top:8px;background:#b3202b;color:#fff8df;font-size:7px;font-weight:900;letter-spacing:1.2px;padding:5px 8px;border-radius:4px;transform:rotate(9deg);box-shadow:0 3px 8px rgba(0,0,0,.25);z-index:2}
.bartenderPromotion:active{transform:scale(.985)}

.bartenderFeature{display:flex;align-items:center;gap:12px;border:1px solid #dfd4b7;background:#fffdf7}
.bartenderFeatureIcon{width:42px;height:42px;border-radius:13px;background:#f4ecd8;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.bartenderFeature div{flex:1}.bartenderFeature span{display:block;font-size:9px;color:#8a7650;text-transform:uppercase;letter-spacing:1px;font-weight:850}
.bartenderFeature strong{display:block;font-size:15px;margin-top:2px}.bartenderFeature p{font-size:10px;color:#70777b;margin:3px 0 0;line-height:1.3}
.bartenderFeature>b{font-size:27px;font-weight:400}.bartenderQuote{margin:4px 8px 20px;text-align:center;font-family:Georgia,serif;font-style:italic;color:#0b4f3e;font-size:13px}

/* Team busyness status */
.serviceStatusCaption{display:flex;align-items:center;gap:10px;margin:0 0 9px;padding:1px 2px}.serviceStatusCaption h3{margin:0;font-size:15px;line-height:1.1;color:#202226;font-weight:850}.serviceStatusCaption p{margin:3px 0 0;font-size:10px;line-height:1.2;color:#70777b}.serviceStatusIcon{font-size:15px;letter-spacing:-2px;color:#087b62;font-weight:900;transform:scaleY(.8)}

.busyStatusWrap{background:#fff;border-radius:18px;padding:10px 12px 9px;margin-bottom:14px;border:1px solid #e4e7e6;box-shadow:0 2px 10px #00000007}
.busyStatusLine{height:9px;width:100%;border-radius:999px;background:#e7ecea;transition:background .2s}
.busyStatusLine.notbusy{background:#16a36f}.busyStatusLine.slight{background:#e6b400}.busyStatusLine.busy{background:#d93632}
.busyStatusButtons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}
.busyStatusBtn{border:0;border-radius:8px;padding:6px 4px;font-size:10px;font-weight:850;cursor:pointer;background:#f1f3f2;color:#4c5555}
.busyStatusBtn.active.notbusyBtn{background:#e6f7ef;color:#087b62}.busyStatusBtn.active.slightBtn{background:#fff6d9;color:#866900}.busyStatusBtn.active.busyBtn{background:#fff0ef;color:#b82e29}
.staffStatusOnly{margin:0 0 14px;padding:0 2px}.staffStatusOnly .busyStatusLine{height:8px}
.footerSpace{height:20px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#171a1d;color:white;padding:11px 16px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1}

.shiftChoice{border:1px solid #e1e5e4;background:#fff;border-radius:12px;padding:12px 8px;font-size:13px;color:#303536;cursor:pointer;min-height:72px}.shiftChoice.active{border:2px solid #15966f;background:#edf9f4;color:#087a5a}

/* Staff Team Overview */
.teamOverview{margin:14px 0 14px;padding:18px 18px 16px;background:#fff;border:1px solid #eef0ef;border-radius:24px;box-shadow:0 2px 12px rgba(25,35,30,.04)}
.teamOverviewHead{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px}
.teamOverviewHead h2{margin:0;font-size:25px;line-height:1.1;color:#171a1d;font-weight:850}
.teamOverviewHead span{font-size:18px;color:#70777b;font-weight:500}
.teamOverviewStats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.teamOverviewStat{background:#f7f8fa;border-radius:18px;padding:18px 14px;min-height:104px;box-sizing:border-box}
.teamOverviewStat .label{display:block;font-size:17px;line-height:1.15;color:#667078;font-weight:500;margin-bottom:18px}
.teamOverviewStat .value{display:block;font-size:39px;line-height:1;color:#11151a;font-weight:850}
@media(max-width:520px){.teamOverview{padding:17px 14px 15px;border-radius:22px}.teamOverviewHead{margin-bottom:13px}.teamOverviewHead h2{font-size:23px}.teamOverviewHead span{font-size:17px}.teamOverviewStats{gap:8px}.teamOverviewStat{padding:15px 11px;min-height:96px;border-radius:16px}.teamOverviewStat .label{font-size:14px;margin-bottom:16px}.teamOverviewStat .value{font-size:34px}}

/* Final staff category card styling — matched to approved reference */
.staffCategoryCard{
  min-height:78px; padding:14px 18px; margin:0 0 12px;
  border:1px solid #dfe3e2; border-radius:20px; background:#fff;
  display:flex; align-items:center; gap:18px; width:100%; box-sizing:border-box;
  box-shadow:0 3px 12px rgba(0,0,0,.035); cursor:pointer;
}
.staffCategoryCard.open{border-color:#087b62;background:#f7fbfa;border-radius:20px 20px 0 0;margin-bottom:0}
.staffCategoryIcon{font-size:38px;width:58px;min-width:58px;text-align:center;line-height:1}
.staffCategoryText{flex:1;min-width:0}
.staffCategoryText h3{margin:0;font-size:19px;line-height:1.2;font-weight:850;color:#171a1d}
.staffCategoryText p{margin:5px 0 0;font-size:14px;line-height:1.25;color:#70777b;font-weight:500}
.staffCategoryArrow{font-size:30px;color:#171a1d;font-weight:500;line-height:1}
.staffCategoryContent{background:#fff;border:1px solid #dfe3e2;border-top:0;border-radius:0 0 20px 20px;margin:-12px 0 12px;padding:14px 18px}
@media(max-width:520px){
  .staffCategoryCard{min-height:76px;padding:14px 16px;gap:14px;border-radius:18px}
  .staffCategoryIcon{font-size:34px;width:48px;min-width:48px}
  .staffCategoryText h3{font-size:17px}
  .staffCategoryText p{font-size:12px}
  .staffCategoryArrow{font-size:27px}
}

/* FINAL STAFF CATEGORY CARD STYLE */
.staffCategories{padding:0;background:transparent;border:0;box-shadow:none}
.categoriesHeader{display:flex;justify-content:flex-end;min-height:24px;margin:0 2px 10px}
.categoryGrid{display:block}
.categoryBtn,.staffCategoryCard{box-sizing:border-box;width:100%;min-height:94px;margin:0 0 12px;border:1px solid #dfe3e2;background:#fff;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:16px;color:#171a1d;cursor:pointer;text-align:left;box-shadow:0 2px 10px rgba(25,35,30,.04);transition:.15s}
.categoryBtnMain{background:#fff;border-color:#dfe3e2}
.categoryBtn.active,.staffCategoryCard.open{background:#eaf7f3;border-color:#087b62}
.categoryIcon,.staffCategoryIcon{font-size:40px;width:64px;min-width:64px;flex:none;text-align:center}
.categoryText,.staffCategoryText{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.categoryText strong,.staffCategoryText h3{margin:0;font-size:18px;line-height:1.15;color:#171a1d}
.categoryBtn.active .categoryText strong,.staffCategoryCard.open .staffCategoryText h3{color:#087b62}
.categoryText small,.staffCategoryText p{margin:0;font-size:12px;color:#70777b;font-weight:500;line-height:1.3}
.categoryChevron,.staffCategoryArrow{margin-left:auto;font-size:28px;line-height:1;color:#171a1d;font-weight:500;flex:none}
.categoryBtn.active .categoryChevron,.staffCategoryCard.open .staffCategoryArrow{color:#087b62}
.staffCategoryCard{margin-bottom:12px}
.staffCategoryContent{margin:-4px 0 12px;padding:12px 16px;background:#f7f9f8;border:1px solid #e5e8e7;border-radius:14px}


/* Staff dashboard header: manager-controlled status is shown to staff as one solid line only. */
.staffDashboardHeader{background:var(--dark);color:#fff;border-radius:22px;padding:20px 20px 18px;margin-bottom:14px;overflow:hidden}
.staffDashboardTop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.staffDashboardTop h1{margin:0;font-size:25px;line-height:1.08;font-weight:900;letter-spacing:-.3px}
.staffDashboardTop p{margin:7px 0 0;color:#c7c9cc;font-size:12px;line-height:1.3}
.staffGreeting{text-align:right;display:flex;flex-direction:column;gap:4px;padding-top:1px;white-space:nowrap}
.staffGreeting strong{font-size:15px}
.staffGreeting span{font-size:12px;color:#c7c9cc}
.staffDashboardHeader .staffStatusOnly{margin:18px 0 0;padding:0}
.staffDashboardHeader .busyStatusLine{height:9px;background:#16a36f}

/* Final team-status colors: the active status must override the default green line. */
.busyStatusLine.notbusy{background:#16a36f !important;}
.busyStatusLine.slight{background:#e6b400 !important;}
.busyStatusLine.busy{background:#d93632 !important;}
 .homeFooter{text-align:center;padding:28px 0 18px;color:#8a8f93;font-size:11px;line-height:1.5;letter-spacing:.2px}.homeFooter strong{display:block;color:#6f7478;font-size:12px;letter-spacing:.4px}.homeFooter span{display:block;margin-top:2px}
 .greetingEditBtn{padding:8px 11px;font-size:11px;border-radius:999px}.greetingEditRow{display:flex;justify-content:flex-end;margin:0 0 8px}.greetingHint{font-size:11px;color:var(--muted);margin-top:6px}

@media (max-width:380px){#homePage .hero h1{font-size:21px}.roleCard{padding:16px 14px}.roleText h2{font-size:16px}}

/* MALAN V26 — exact premium hospitality visual treatment */
:root{--malan-gold:#c79b3b;--malan-gold-soft:#e4c77d;--malan-green:#0b4f3e;--malan-cream:#f8f6ef;}
body{background:var(--malan-cream);}
#homePage{background:transparent;}



#homePage .roleCard{background:rgba(255,255,255,.96);border:1px solid rgba(199,155,59,.7);border-radius:25px;padding:20px 18px;box-shadow:0 8px 22px rgba(30,38,34,.10);min-height:96px;}
#homePage .roleCard:hover{transform:translateY(-1px);}
#homePage .roleIcon{width:58px;height:58px;border-radius:17px;background:var(--malan-green);border:2px solid #d5b25f;color:#efcf82;font-size:28px;box-shadow:0 3px 8px rgba(0,0,0,.08);}
#homePage .roleCard::before{content:"";width:2px;height:52px;background:#d6b76f;display:block;order:1;margin-left:2px;}
#homePage .roleIcon{order:0} #homePage .roleText{order:2} #homePage .roleArrow{order:3;margin-left:auto;width:43px;height:43px;border-radius:50%;background:#f4f2ed;color:#1e2322;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 2px 7px rgba(0,0,0,.06);}
#homePage .homeFooter{padding:36px 0 30px;position:relative;z-index:2;}
#homePage .homeFooter strong{font-family:Georgia,serif;color:#252827;font-size:15px;letter-spacing:5px;}
#homePage .homeFooter strong::after{content:"";display:block;width:55px;height:2px;background:#c79b3b;margin:10px auto 10px;}
#homePage .homeFooter span{color:#71777a;font-size:12px;}
#homePage .homeFooter::after{content:"P E O P L E  ·  S E R V I C E  ·  E X C E L L E N C E";display:block;margin-top:14px;color:#c79b3b;font-size:9px;letter-spacing:2px;font-weight:700;}
/* Subtle matching treatment across every page */
.page:not(#homePage) .hero, .page:not(#homePage) .staffDashboardHeader, .page:not(#homePage) .managerDashboardHero{border:1px solid rgba(199,155,59,.42);box-shadow:0 9px 25px rgba(25,31,29,.10);}

/* NEGRONI PHOTO — DIRECT EMBED FIX */
.recipeDetailHero{display:flex!important;align-items:stretch!important;overflow:hidden!important;padding:0!important;min-height:210px}
.recipeHeroPhotoWrap{width:48%;min-height:210px;flex:0 0 48%;background:#101816}
.recipeHeroPhoto{display:block!important;width:100%!important;height:210px!important;object-fit:cover!important}
.recipeDetailHeroText{flex:1;padding:20px 17px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.recipeThumb{overflow:hidden!important;padding:0!important}
.recipeThumb img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important}
@media(max-width:380px){
 .recipeDetailHero{min-height:175px!important}
 .recipeHeroPhotoWrap{min-height:175px}
 .recipeHeroPhoto{height:175px!important}
 .recipeDetailHeroText{padding:13px 11px}
 .recipeDetailHero h1{font-size:19px}
}

/* Negroni tap fallback: works even if JavaScript is unavailable */
#negroniRecipeCard { position:relative; z-index:1000; display:flex !important; width:100%; text-decoration:none; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:rgba(0,0,0,.08); }
#negroniRecipeCard * { pointer-events:none; }
#recipeDetailPage:target { display:block !important; }

/* V38 — PURE HTML NEGRONI NAVIGATION FALLBACK */
#negroniRecipeCard { cursor:pointer !important; position:relative !important; z-index:9999 !important; pointer-events:auto !important; display:flex !important; text-decoration:none !important; }
#negroniRecipeCard * { pointer-events:none !important; }
#recipeDetailPage:target { display:block !important; visibility:visible !important; opacity:1 !important; }
body:has(#recipeDetailPage:target) #recipeLibraryPage { display:none !important; }
body:has(#recipeDetailPage:target) #bartenderPage { display:none !important; }
body:has(#recipeDetailPage:target) #homePage { display:none !important; }
#recipeDetailPage .backBtn { position:relative; z-index:10000; }

/* V39 NATIVE TAP: HTML details/summary, no JS navigation required */
.negroniNative{padding:0!important;overflow:hidden;background:#fff;display:block!important;width:100%!important;min-width:0!important;max-width:100%!important;box-sizing:border-box!important;flex:none!important}
.negroniNativeSummary{list-style:none;display:flex!important;width:100%!important;min-width:0!important;box-sizing:border-box!important;align-items:center;gap:12px;padding:12px;min-height:84px;cursor:pointer;touch-action:manipulation}
.negroniNativeSummary::-webkit-details-marker{display:none} .negroniNativeSummary::marker{display:none}
.negroniNativeSummary>*{pointer-events:none}
.negroniNativeSummary .recipeInfo{flex:1;min-width:0}
.negroniNative[open] .negroniNativeSummary>b{transform:rotate(90deg)}
.nativeRecipeBody{display:block!important;width:100%!important;min-width:0!important;max-width:100%!important;box-sizing:border-box!important;border-top:1px solid #e1e5e4;padding:16px 13px 20px}
.nativeRecipeTitle{font-size:24px;font-weight:900;color:#0b4f3e} .nativeProfile{font-size:11px;font-weight:800;color:#70777b;margin:3px 0 12px}
.nativeRecipePhoto{display:block;width:100%;height:230px;object-fit:cover;border-radius:15px;margin-bottom:14px}
.nativeMeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px} .nativeMeta>div{background:#f5f7f6;border-radius:11px;padding:10px} .nativeMeta small{display:block;font-size:9px;color:#70777b;font-weight:800;margin-bottom:3px} .nativeMeta strong{display:block;font-size:11px}
.nativeRecipeBody h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#0b4f3e;margin:16px 0 8px} .nativeRecipeBody p,.nativeRecipeBody li{font-size:12px;line-height:1.55;color:#303638} .nativeRecipeBody ol{padding-left:20px}

/* V46 separate Beverage Manager */
.beverageManagerHero{background:linear-gradient(135deg,#173f35,#315f50)!important;color:#fff}
.beverageManagerHero h1,.beverageManagerHero p{color:#fff!important}
#beverageManagerPage .sectionTitle{color:#0b4f3e}
#beverageManagerPage textarea{resize:vertical;min-height:80px}
.bmPhotoPreview{width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin-top:10px}
.bmPublishedRow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.bmPublishedRow:last-child{border-bottom:0}.bmPublishedRow img{width:54px;height:54px;border-radius:12px;object-fit:cover}
.bmRowInfo{flex:1;min-width:0}.bmRowInfo strong{display:block;color:#0b4f3e}.bmRowInfo small{display:block;color:#777;margin-top:2px}
.bmEdit{background:#e7f0ea;color:#2f6b4f;border:1px solid #b9d0c0;border-radius:10px;padding:8px 10px;font-weight:700;margin-left:6px}.bmDelete{border:0;background:#f5eeee;color:#9b3d3d;border-radius:10px;padding:8px 10px;font-weight:800}

/* V48 — Unified cocktail recipe card format for Beverage Manager + Bartender */
/* Published recipes use the same card format */
.publishedRecipeCard{border:1px solid #e5e9e8!important;border-radius:22px!important;overflow:hidden!important;background:#fff!important}
.publishedRecipeCard .negroniNativeSummary{padding:12px!important}
.publishedRecipeCard .nativeRecipeBody{padding:0 14px 16px!important}
.publishedRecipeCard .nativeRecipeTitle{font-size:22px!important;font-weight:900!important;color:#0b4f3e!important;margin:0 0 3px!important}
.publishedRecipeCard .nativeProfile{font-size:11px!important;color:#687174!important;font-weight:800!important;margin:0 0 11px!important}
.publishedRecipeCard .nativeRecipePhoto{height:310px!important;max-height:none!important;object-fit:cover!important;border-radius:17px!important;margin:0 0 13px!important}
.publishedRecipeCard .publishedCaption{font-size:13px!important;line-height:1.45!important;color:#303638!important;margin:0 0 14px!important;font-style:italic!important}
.publishedRecipeCard .publishedMeta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}
.publishedRecipeCard .publishedMeta>div{background:#f4f6f5;border-radius:16px;padding:11px 12px;min-height:48px;box-sizing:border-box}
.publishedRecipeCard .publishedMeta small{display:block;font-size:8px;letter-spacing:1px;color:#7b8587;font-weight:900}
.publishedRecipeCard .publishedMeta strong{display:block;font-size:12px;color:#202426;margin-top:3px;line-height:1.25}
.publishedRecipeCard .publishedSection{font-size:15px!important;color:#0b4f3e!important;letter-spacing:.5px;margin:14px 0 7px!important}
.publishedRecipeCard .publishedIngredients{border-top:1px solid #e7e9e8}
.publishedRecipeCard .publishedIngredient{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #e7e9e8;font-size:13px;line-height:1.3}
.publishedRecipeCard .publishedIngredient b{color:#0b4f3e;white-space:nowrap}
.publishedRecipeCard .publishedSteps{margin:0;padding-left:20px}.publishedRecipeCard .publishedSteps li{padding:4px 0;font-size:12px;line-height:1.35}
.publishedRecipeCard .publishedText{font-size:12px;color:#5f686a;line-height:1.45;margin:0 0 12px}
.publishedRecipeCard .publishedEquipment{font-size:12px;color:#303638;line-height:1.5;white-space:pre-line;margin:0}
/* V89.25 — Beverage Manager Signature Cocktail Outlet assignment */
  /* V89.26 — Signature Cocktails strictly isolated by assigned outlet */
/* V89.28 — Signature Mocktails with the same outlet-isolated flow */
.bmOutletChoice{background:#f8f6ee;border:1px solid #d6b76f;border-radius:16px;padding:12px 13px;margin:10px 0 4px}
.bmOutletChoice label{display:block;font-size:9px;letter-spacing:1.2px;color:#7d725a;font-weight:900;margin-bottom:6px}
.bmOutletChoice select{width:100%;box-sizing:border-box;border:1px solid #cdbb88;border-radius:12px;background:#fff;color:#164f42;font-size:14px;font-weight:800;padding:12px 38px 12px 12px;outline:none}
.bmOutletChoice small{display:block;color:#777d7f;font-size:10px;line-height:1.35;margin-top:6px}
.bmPublishedRow .bmOutletTag{display:inline-block;margin-top:4px;padding:3px 7px;border-radius:999px;background:#f4eedf;color:#7b6633;font-size:8px;font-weight:900;letter-spacing:.5px}

@media(max-width:380px){.publishedRecipeCard .nativeRecipePhoto{height:250px!important}}


/* V50 — Outlet-first dashboard */
/* V51 — Keep Bartender + Beverage Manager on first screen */
/* V52 — Selected outlet is the Staff/Manager trigger */

/* V53 — Reliable one-tap outlet interaction */
/* V54 — Outlet contains Staff + Manager only */
/* V55 — Strict separation:

/* V56 — Outlet requires login before Staff/Manager workspace */
.outletLoginSheet{max-width:430px}
.outletLoginSheet .input{width:100%;box-sizing:border-box;margin:8px 0 4px;padding:13px 14px;border:1px solid #d9dfdc;border-radius:12px;font-size:14px;background:#fff;outline:none}
.outletLoginSheet .input:focus{border-color:#087b62;box-shadow:0 0 0 3px rgba(8,123,98,.08)}
.fieldLabel{display:block;margin-top:12px;font-size:10px;font-weight:850;color:#596261;text-transform:uppercase;letter-spacing:.6px}
.loginError{margin-top:8px;padding:9px 10px;border-radius:10px;background:#fff0f0;color:#a33a3a;font-size:11px;font-weight:700}
 Main = Outlet + Bartender + Beverage Manager; Outlet = Staff + Manager */
.outletRoleSection{margin:0 0 12px;padding:10px;border:1px solid #dfd3b2;border-radius:18px;background:#f8faf8}
.outletRoleHeader{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px 7px}
.outletRoleHeader>div{display:flex;flex-direction:column;gap:2px}
.outletRoleHeader strong{font-size:12px;color:#0b4f3e}
.outletRoleHeader span{font-size:9px;color:#737b7d}
.outletCollapseBtn{border:1px solid #d8cfb5;background:#fff;border-radius:9px;width:30px;height:28px;color:#0b4f3e;font-weight:900}
.outletRoleSection .roleCard{margin-bottom:8px}
.outletRoleSection .roleCard:last-child{margin-bottom:0}

#outletDependentRoles{margin-top:0}
.mainScreenRoles{margin-top:12px}

.selectedOutletBar{position:relative;z-index:5;min-height:64px;touch-action:manipulation;-webkit-tap-highlight-color:rgba(8,123,98,.12)}
.outletOption{position:relative;z-index:2;touch-action:manipulation;-webkit-tap-highlight-color:rgba(8,123,98,.12)}
.outletSelectCard{position:relative;z-index:5;touch-action:manipulation}

.selectedOutletBar{cursor:pointer}
.selectedOutletBar:active{transform:scale(.995)}
.selectedOutletText:after{content:"Tap outlet to show Staff & Manager";display:block;font-size:9px;color:#087b62;font-weight:700;margin-top:3px}

.bartenderHomeCard,.beverageManagerHomeCard{position:relative}
.newBadge{position:absolute;right:16px;top:12px;background:#086b57;color:#fff;border-radius:999px;padding:6px 10px;font-size:9px;font-weight:900;letter-spacing:.4px}
.managementBadge{position:absolute;right:12px;top:10px;background:#80651b;color:#fff;border-radius:999px;padding:6px 10px;font-size:8px;font-weight:900;letter-spacing:.5px}

.outletSelectCard{display:flex;align-items:center;gap:13px;cursor:pointer;padding:18px;background:#fff;border:1px solid #e7dfca;box-shadow:0 5px 18px rgba(20,30,25,.06);position:relative;margin-bottom:12px}
.outletSelectCard:before{content:"";width:3px;height:42px;border-radius:4px;background:#c9a650;position:absolute;left:0;top:50%;transform:translateY(-50%)}
.outletSelectIcon,.selectedOutletIcon{width:46px;height:46px;border-radius:14px;background:#edf5f1;border:1px solid #e5d9b9;display:flex;align-items:center;justify-content:center;font-size:23px;flex:none}
.selectedOutletBar{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid #e4dcc7;border-radius:18px;padding:10px 11px;margin:0 0 12px;box-shadow:0 5px 18px rgba(20,30,25,.05)}
.selectedOutletBar .selectedOutletIcon{width:42px;height:42px;border-radius:12px}
.selectedOutletText{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.selectedOutletText strong{font-size:13px;color:#202226;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selectedOutletText span{font-size:10px;color:#737b7d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.changeOutletBtn{border:1px solid #dfd3b2;background:#faf8f0;color:#6f5a18;border-radius:11px;padding:8px 10px;font-size:10px;font-weight:850;white-space:nowrap;cursor:pointer}
.outletModal{display:none;position:fixed;inset:0;background:rgba(15,20,18,.56);align-items:flex-end;justify-content:center;z-index:100}
.outletModal.show{display:flex}
.outletSheet{width:100%;max-width:430px;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px 18px;box-shadow:0 -10px 35px rgba(0,0,0,.18);max-height:86vh;overflow:auto}
.outletClose{float:right;width:34px;height:34px;border:0;border-radius:11px;background:#f2f4f3;color:#303536;font-size:23px;line-height:1;cursor:pointer}
.outletModalIcon{width:48px;height:48px;border-radius:15px;background:#edf5f1;border:1px solid #e4d7b7;display:grid;place-items:center;font-size:24px;margin-bottom:10px}
.outletSheet h2{margin:0 0 4px;color:#0b4f3e;font-size:21px}
.outletSheet>p{margin:0 0 14px;color:#70777b;font-size:12px}
.outletOptions{display:flex;flex-direction:column;gap:8px}
.outletOption{display:flex;align-items:center;gap:10px;width:100%;border:1px solid #e5e8e7;background:#fff;border-radius:14px;padding:9px;text-align:left;cursor:pointer}
.outletOption.selected{border-color:#087b62;background:#f1faf6;box-shadow:inset 0 0 0 1px rgba(8,123,98,.12)}
.outletOptionThumb{width:46px;height:46px;border-radius:11px;background:#f3f5f4;display:grid;place-items:center;font-size:22px;flex:none}
.outletOptionText{flex:1;min-width:0}
.outletOptionText strong{display:block;font-size:13px;color:#202226}
.outletOptionText span{display:block;font-size:10px;color:#737b7d;margin-top:2px}
.outletRadio{width:21px;height:21px;border-radius:50%;border:2px solid #aab2b0;position:relative;flex:none}
.outletOption.selected .outletRadio{border-color:#087b62}
.outletOption.selected .outletRadio:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#087b62;left:4px;top:4px}
.outletModalActions{display:grid;grid-template-columns:1fr 1.15fr;gap:9px;margin-top:15px}
.outletModalActions .btn{width:100%}
#homeRoles .roleCard{margin-bottom:12px}


.activeOutletBanner{
  display:flex;align-items:center;gap:10px;
  margin:0 0 12px;padding:10px 13px;
  border:1px solid rgba(183,146,75,.28);
  border-radius:14px;
  background:linear-gradient(135deg,rgba(183,146,75,.12),rgba(255,255,255,.96));
  box-shadow:0 4px 14px rgba(0,0,0,.05);
}
.activeOutletBanner .outletBadgeIcon{
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:#fff;border:1px solid rgba(183,146,75,.25);font-size:18px;
}
.activeOutletBanner .outletBannerText{min-width:0;flex:1}
.activeOutletBanner .outletBannerLabel{
  display:block;font-size:10px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;opacity:.6;margin-bottom:2px;
}
.activeOutletBanner .outletBannerName{
  display:block;font-size:14px;font-weight:800;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.activeOutletBanner .outletBannerLocation{
  display:block;font-size:10px;opacity:.62;margin-top:1px;
}
