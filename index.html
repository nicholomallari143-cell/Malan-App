/* NEGRONI / RECIPE DETAIL EXPANSION */
.recipePrepCard{display:flex;align-items:center}

/* RECIPE LIBRARY NATIVE EXPANSION — keep recipe cards vertical on mobile */

.nativeRecipePhoto{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;max-height:430px!important;object-fit:cover!important;border-radius:14px!important;margin:10px 0 14px!important}

.bartenderPromotion:after{content:"";position:absolute;right:-26px;bottom:-38px;width:120px;height:120px;border:1px solid rgba(228,199,125,.22);border-radius:50%;pointer-events:none}
.bartenderPromotionIcon{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(0,0,0,.2);border:1px solid #d6b76f;font-size:27px;position:relative;z-index:1}
.bartenderPromotionBody{flex:1;position:relative;z-index:1;min-width:0}
.bartenderPromotionKicker{font-size:8px;letter-spacing:2.2px;color:#e4c77d;font-weight:900;text-transform:uppercase;margin-bottom:2px}
.bartenderPromotionTitle{font-family:Georgia,serif;font-size:21px;line-height:1.05;font-weight:800;letter-spacing:.5px}
.bartenderPromotionSub{font-size:10px;color:#e8ece9;margin-top:4px;line-height:1.25}
.bartenderPromotionArrow{width:40px;height:40px;border-radius:50%;border:1px solid #d6b76f;display:flex;align-items:center;justify-content:center;color:#f0d58e;font-size:25px;font-weight:300;position:relative;z-index:1;flex:none}
.bartenderPromotionBadge{position:absolute;right:9px;top:8px;background:#b3202b;color:#fff8df;font-size:7px;font-weight:900;letter-spacing:1.2px;padding:5px 8px;border-radius:4px;transform:rotate(9deg);box-shadow:0 3px 8px rgba(0,0,0,.25);z-index:2}
.bartenderPromotion:active{transform:scale(.985)}

.bartenderFeature{display:flex;align-items:center;gap:12px;border:1px solid #dfd4b7;background:#fffdf7}
.bartenderFeatureIcon{width:42px;height:42px;border-radius:13px;background:#f4ecd8;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.bartenderFeature div{flex:1}.bartenderFeature span{display:block;font-size:9px;color:#8a7650;text-transform:uppercase;letter-spacing:1px;font-weight:850}
.bartenderFeature strong{display:block;font-size:15px;margin-top:2px}.bartenderFeature p{font-size:10px;color:#70777b;margin:3px 0 0;line-height:1.3}
.bartenderFeature>b{font-size:27px;font-weight:400}.bartenderQuote{margin:4px 8px 20px;text-align:center;font-family:Georgia,serif;font-style:italic;color:#0b4f3e;font-size:13px}

/* Team busyness status */
.serviceStatusCaption{display:flex;align-items:center;gap:10px;margin:0 0 9px;padding:1px 2px}.serviceStatusCaption h3{margin:0;font-size:15px;line-height:1.1;color:#202226;font-weight:850}.serviceStatusCaption p{margin:3px 0 0;font-size:10px;line-height:1.2;color:#70777b}.serviceStatusIcon{font-size:15px;letter-spacing:-2px;color:#087b62;font-weight:900;transform:scaleY(.8)}

.busyStatusWrap{background:#fff;border-radius:18px;padding:10px 12px 9px;margin-bottom:14px;border:1px solid #e4e7e6;box-shadow:0 2px 10px #00000007}
.busyStatusLine{height:9px;width:100%;border-radius:999px;background:#e7ecea;transition:background .2s}
.busyStatusLine.notbusy{background:#16a36f}.busyStatusLine.slight{background:#e6b400}.busyStatusLine.busy{background:#d93632}
.busyStatusButtons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}
.busyStatusBtn{border:0;border-radius:8px;padding:6px 4px;font-size:10px;font-weight:850;cursor:pointer;background:#f1f3f2;color:#4c5555}
.busyStatusBtn.active.notbusyBtn{background:#e6f7ef;color:#087b62}.busyStatusBtn.active.slightBtn{background:#fff6d9;color:#866900}.busyStatusBtn.active.busyBtn{background:#fff0ef;color:#b82e29}
.staffStatusOnly{margin:0 0 14px;padding:0 2px}.staffStatusOnly .busyStatusLine{height:8px}
.footerSpace{height:20px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#171a1d;color:white;padding:11px 16px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1}

.shiftChoice{border:1px solid #e1e5e4;background:#fff;border-radius:12px;padding:12px 8px;font-size:13px;color:#303536;cursor:pointer;min-height:72px}.shiftChoice.active{border:2px solid #15966f;background:#edf9f4;color:#087a5a}

/* Staff Team Overview */
.teamOverview{margin:14px 0 14px;padding:18px 18px 16px;background:#fff;border:1px solid #eef0ef;border-radius:24px;box-shadow:0 2px 12px rgba(25,35,30,.04)}
.teamOverviewHead{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px}
.teamOverviewHead h2{margin:0;font-size:25px;line-height:1.1;color:#171a1d;font-weight:850}
.teamOverviewHead span{font-size:18px;color:#70777b;font-weight:500}
.teamOverviewStats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.teamOverviewStat{background:#f7f8fa;border-radius:18px;padding:18px 14px;min-height:104px;box-sizing:border-box}
.teamOverviewStat .label{display:block;font-size:17px;line-height:1.15;color:#667078;font-weight:500;margin-bottom:18px}
.teamOverviewStat .value{display:block;font-size:39px;line-height:1;color:#11151a;font-weight:850}
@media(max-width:520px){.teamOverview{padding:17px 14px 15px;border-radius:22px}.teamOverviewHead{margin-bottom:13px}.teamOverviewHead h2{font-size:23px}.teamOverviewHead span{font-size:17px}.teamOverviewStats{gap:8px}.teamOverviewStat{padding:15px 11px;min-height:96px;border-radius:16px}.teamOverviewStat .label{font-size:14px;margin-bottom:16px}.teamOverviewStat .value{font-size:34px}}

/* Final staff category card styling — matched to approved reference */
.staffCategoryCard{
  min-height:78px; padding:14px 18px; margin:0 0 12px;
  border:1px solid #dfe3e2; border-radius:20px; background:#fff;
  display:flex; align-items:center; gap:18px; width:100%; box-sizing:border-box;
  box-shadow:0 3px 12px rgba(0,0,0,.035); cursor:pointer;
}
.staffCategoryCard.open{border-color:#087b62;background:#f7fbfa;border-radius:20px 20px 0 0;margin-bottom:0}
.staffCategoryIcon{font-size:38px;width:58px;min-width:58px;text-align:center;line-height:1}
.staffCategoryText{flex:1;min-width:0}
.staffCategoryText h3{margin:0;font-size:19px;line-height:1.2;font-weight:850;color:#171a1d}
.staffCategoryText p{margin:5px 0 0;font-size:14px;line-height:1.25;color:#70777b;font-weight:500}
.staffCategoryArrow{font-size:30px;color:#171a1d;font-weight:500;line-height:1}
.staffCategoryContent{background:#fff;border:1px solid #dfe3e2;border-top:0;border-radius:0 0 20px 20px;margin:-12px 0 12px;padding:14px 18px}
@media(max-width:520px){
  .staffCategoryCard{min-height:76px;padding:14px 16px;gap:14px;border-radius:18px}
  .staffCategoryIcon{font-size:34px;width:48px;min-width:48px}
  .staffCategoryText h3{font-size:17px}
  .staffCategoryText p{font-size:12px}
  .staffCategoryArrow{font-size:27px}
}

/* FINAL STAFF CATEGORY CARD STYLE */
.staffCategories{padding:0;background:transparent;border:0;box-shadow:none}
.categoriesHeader{display:flex;justify-content:flex-end;min-height:24px;margin:0 2px 10px}
.categoryGrid{display:block}
.categoryBtn,.staffCategoryCard{box-sizing:border-box;width:100%;min-height:94px;margin:0 0 12px;border:1px solid #dfe3e2;background:#fff;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:16px;color:#171a1d;cursor:pointer;text-align:left;box-shadow:0 2px 10px rgba(25,35,30,.04);transition:.15s}
.categoryBtnMain{background:#fff;border-color:#dfe3e2}
.categoryBtn.active,.staffCategoryCard.open{background:#eaf7f3;border-color:#087b62}
.categoryIcon,.staffCategoryIcon{font-size:40px;width:64px;min-width:64px;flex:none;text-align:center}
.categoryText,.staffCategoryText{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.categoryText strong,.staffCategoryText h3{margin:0;font-size:18px;line-height:1.15;color:#171a1d}
.categoryBtn.active .categoryText strong,.staffCategoryCard.open .staffCategoryText h3{color:#087b62}
.categoryText small,.staffCategoryText p{margin:0;font-size:12px;color:#70777b;font-weight:500;line-height:1.3}
.categoryChevron,.staffCategoryArrow{margin-left:auto;font-size:28px;line-height:1;color:#171a1d;font-weight:500;flex:none}
.categoryBtn.active .categoryChevron,.staffCategoryCard.open .staffCategoryArrow{color:#087b62}
.staffCategoryCard{margin-bottom:12px}
.staffCategoryContent{margin:-4px 0 12px;padding:12px 16px;background:#f7f9f8;border:1px solid #e5e8e7;border-radius:14px}


/* Staff dashboard header: manager-controlled status is shown to staff as one solid line only. */
.staffDashboardHeader{background:var(--dark);color:#fff;border-radius:22px;padding:20px 20px 18px;margin-bottom:14px;overflow:hidden}
.staffDashboardTop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.staffDashboardTop h1{margin:0;font-size:25px;line-height:1.08;font-weight:900;letter-spacing:-.3px}
.staffDashboardTop p{margin:7px 0 0;color:#c7c9cc;font-size:12px;line-height:1.3}
.staffGreeting{text-align:right;display:flex;flex-direction:column;gap:4px;padding-top:1px;white-space:nowrap}
.staffGreeting strong{font-size:15px}
.staffGreeting span{font-size:12px;color:#c7c9cc}
.staffDashboardHeader .staffStatusOnly{margin:18px 0 0;padding:0}
.staffDashboardHeader .busyStatusLine{height:9px;background:#16a36f}

/* Final team-status colors: the active status must override the default green line. */
.busyStatusLine.notbusy{background:#16a36f !important;}
.busyStatusLine.slight{background:#e6b400 !important;}
.busyStatusLine.busy{background:#d93632 !important;}
 .homeFooter{text-align:center;padding:28px 0 18px;color:#8a8f93;font-size:11px;line-height:1.5;letter-spacing:.2px}.homeFooter strong{display:block;color:#6f7478;font-size:12px;letter-spacing:.4px}.homeFooter span{display:block;margin-top:2px}
 .greetingEditBtn{padding:8px 11px;font-size:11px;border-radius:999px}.greetingEditRow{display:flex;justify-content:flex-end;margin:0 0 8px}.greetingHint{font-size:11px;color:var(--muted);margin-top:6px}

@media (max-width:380px){#homePage .hero h1{font-size:21px}.roleCard{padding:16px 14px}.roleText h2{font-size:16px}}

/* MALAN V26 — exact premium hospitality visual treatment */
:root{--malan-gold:#c79b3b;--malan-gold-soft:#e4c77d;--malan-green:#0b4f3e;--malan-cream:#f8f6ef;}
body{background:var(--malan-cream);}
#homePage{background:transparent;}



#homePage .roleCard{background:rgba(255,255,255,.96);border:1px solid rgba(199,155,59,.7);border-radius:25px;padding:20px 18px;box-shadow:0 8px 22px rgba(30,38,34,.10);min-height:96px;}
#homePage .roleCard:hover{transform:translateY(-1px);}
#homePage .roleIcon{width:58px;height:58px;border-radius:17px;background:var(--malan-green);border:2px solid #d5b25f;color:#efcf82;font-size:28px;box-shadow:0 3px 8px rgba(0,0,0,.08);}
#homePage .roleCard::before{content:"";width:2px;height:52px;background:#d6b76f;display:block;order:1;margin-left:2px;}
#homePage .roleIcon{order:0} #homePage .roleText{order:2} #homePage .roleArrow{order:3;margin-left:auto;width:43px;height:43px;border-radius:50%;background:#f4f2ed;color:#1e2322;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 2px 7px rgba(0,0,0,.06);}
#homePage .homeFooter{padding:36px 0 30px;position:relative;z-index:2;}
#homePage .homeFooter strong{font-family:Georgia,serif;color:#252827;font-size:15px;letter-spacing:5px;}
#homePage .homeFooter strong::after{content:"";display:block;width:55px;height:2px;background:#c79b3b;margin:10px auto 10px;}
#homePage .homeFooter span{color:#71777a;font-size:12px;}
#homePage .homeFooter::after{content:"P E O P L E  ·  S E R V I C E  ·  E X C E L L E N C E";display:block;margin-top:14px;color:#c79b3b;font-size:9px;letter-spacing:2px;font-weight:700;}
/* Subtle matching treatment across every page */
.page:not(#homePage) .hero, .page:not(#homePage) .staffDashboardHeader, .page:not(#homePage) .managerDashboardHero{border:1px solid rgba(199,155,59,.42);box-shadow:0 9px 25px rgba(25,31,29,.10);}

/* NEGRONI PHOTO — DIRECT EMBED FIX */
.recipeDetailHero{display:flex!important;align-items:stretch!important;overflow:hidden!important;padding:0!important;min-height:210px}
.recipeHeroPhotoWrap{width:48%;min-height:210px;flex:0 0 48%;background:#101816}
.recipeHeroPhoto{display:block!important;width:100%!important;height:210px!important;object-fit:cover!important}
.recipeDetailHeroText{flex:1;padding:20px 17px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.recipeThumb{overflow:hidden!important;padding:0!important}
.recipeThumb img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important}
@media(max-width:380px){
 .recipeDetailHero{min-height:175px!important}
 .recipeHeroPhotoWrap{min-height:175px}
 .recipeHeroPhoto{height:175px!important}
 .recipeDetailHeroText{padding:13px 11px}
 .recipeDetailHero h1{font-size:19px}
}
